
name: Create Empty Branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-empty-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Create empty branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo

          git config user.name "HarishJunja"
          git config user.email "111532748+HarishJunja@users.noreply.github.com"

          git checkout --orphan empty-new
          git rm -rf . || true

          git commit --allow-empty -m "Create empty branch"

          git push origin empty-new:refs/heads/empty
